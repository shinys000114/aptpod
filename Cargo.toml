[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/shinys000114/aptpod"
homepage = "https://github.com/shinys000114/aptpod"
authors = ["shinys000114"]

[workspace.dependencies]
aptpod-core = { path = "crates/aptpod-core" }
aptpod-repo = { path = "crates/aptpod-repo" }
aptpod-mirror = { path = "crates/aptpod-mirror" }
clap = { version = "4.6", features = ["derive", "env"] }
ar = "0.9"
tar = { version = "0.4", default-features = false }
flate2 = "1.1"
liblzma = { version = "0.4", features = ["static"] }
zstd = "0.14"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
time = { version = "0.3", features = ["formatting", "macros"] }
thiserror = "2"
rustix = { version = "1", features = ["fs", "termios", "process"] }
pgp = "0.21"
tempfile = "3"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
toml = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "io-util", "net", "time"] }
tower-http = { version = "0.7", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.6"
# System zoneinfo first; the bundled copy covers hosts without tzdata.
jiff = { version = "1", features = ["tzdb-bundle-always"] }
getrandom = "0.4"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.13", features = ["blocking", "json", "multipart", "stream", "query"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Password hashing is far too slow unoptimized (tests, debug servers).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
