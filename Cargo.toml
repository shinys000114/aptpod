[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/shinys000114/aptpod"
homepage = "https://github.com/shinys000114/aptpod"
authors = ["shinys000114"]

[workspace.dependencies]
aptpod-core = { path = "crates/aptpod-core" }
aptpod-repo = { path = "crates/aptpod-repo" }
aptpod-mirror = { path = "crates/aptpod-mirror" }
clap = { version = "4.6", features = ["derive"] }
ar = "0.9"
tar = { version = "0.4", default-features = false }
flate2 = "1.1"
liblzma = { version = "0.4", features = ["static"] }
zstd = "0.14"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
time = { version = "0.3", features = ["formatting", "macros"] }
thiserror = "2"
rustix = { version = "1", features = ["fs"] }
pgp = "0.21"
tempfile = "3"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
