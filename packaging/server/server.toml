# aptpod-server bootstrap settings. Repository layouts, mirrors, users and
# schedules live in the server database; manage them with the `aptpod` CLI,
# the web UI, or `aptpod config import <file.toml>`. Add the first user with
# `sudo -u aptpod aptpod-server user add <name> --role admin`.

# Address of the REST API and web UI. Put a TLS reverse proxy in front.
listen = "127.0.0.1:8090"

# Database, package store, uploads and job logs.
data_dir = "/var/lib/aptpod"

# Publishes can only be created under these directories (the web server
# serves them). The aptpod user needs write access.
publish_roots = []

# Mirrors can only be written under these directories (often a separate,
# larger disk). The aptpod user needs write access.
mirror_roots = []

# Mirror syncs that may run at the same time.
#mirror_workers = 1

# Time zone of mirror schedules and status times (default UTC).
#timezone = "Asia/Seoul"

# Public directory for mirror status files (<name>.json, <name>.svg badge,
# index.json), e.g. inside the tree the web server publishes.
#status_dir = "/srv/mirror/status"

# Publishes and mirrors declared in a file (the `aptpod config export`
# format, plus optional top-level `adopt` / `force`), applied at start and on
# `systemctl reload aptpod-server`. What it declares is edited there, not
# through the CLI or web UI; everything else stays editable as usual.
# Check it first with `aptpod-server config-check`; preview a reload with
# `aptpod config plan`.
#config_file = "/etc/aptpod/aptpod.toml"

# Web UI session cookies: set cookie_secure = true when (as recommended) a
# TLS proxy is in front, so browsers send them over HTTPS only. Sessions
# last session_hours; a password change ends them (API tokens stay).
#cookie_secure = false
#session_hours = 12

# Largest accepted upload in bytes (default 2 GiB).
#upload_limit = 2147483648

# Release signing key, used by publishes with sign = true.
#[signing]
#key = "<fingerprint>"
#passphrase_file = "/etc/aptpod/signing.pass"
#homedir = "/var/lib/aptpod/gnupg"
