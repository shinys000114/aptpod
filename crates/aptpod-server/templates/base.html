<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"selfRequestsOnly":true}'>
<title>{% block title %}aptpod{% endblock %}</title>
<link rel="stylesheet" href="{{ s.base }}ui/style.css">
<script src="{{ s.base }}ui/htmx-2.0.11.min.js"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ s.csrf }}"}'>
<header>
  <a class="brand" href="{{ s.base }}">aptpod</a>
  {% if !s.user.is_empty() %}
  <nav>
    <a href="{{ s.base }}">Overview</a>
    <a href="{{ s.base }}mirrors">Mirrors</a>
    <a href="{{ s.base }}jobs">Jobs</a>
    <a href="{{ s.base }}account">Account</a>
    {% if s.role == "admin" %}<a href="{{ s.base }}admin/users">Users</a>{% endif %}
  </nav>
  <span class="who">{{ s.user }} ({{ s.role }})
    <button class="link" hx-post="{{ s.base }}logout">Log out</button>
  </span>
  {% endif %}
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
