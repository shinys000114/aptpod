<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"selfRequestsOnly":true}'>
<title>{% block title %}aptpod{% endblock %}</title>
<link rel="stylesheet" href="{{ s.base }}{{ s.css }}">
<script src="{{ s.base }}ui/htmx-2.0.11.min.js"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ s.csrf }}"}'>
{% if !s.user.is_empty() %}
<div class="app">
<aside class="side">
  <a class="brand" href="{{ s.base }}"><span class="logo">a</span>aptpod</a>
  <nav class="nav">
    <a href="{{ s.base }}"{% if s.section == "publishes" %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Publishes</a>
    <a href="{{ s.base }}mirrors"{% if s.section == "mirrors" %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12a9 9 0 0 1 15.5-6.2"/><path d="M18.5 2v4h-4"/><path d="M5.5 22v-4h4"/></svg>Mirrors</a>
    <a href="{{ s.base }}jobs"{% if s.section == "jobs" %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>Jobs</a>
    <a href="{{ s.base }}account"{% if s.section == "account" %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Account</a>
    {% if s.role == "admin" %}<a href="{{ s.base }}admin/users"{% if s.section == "users" %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18.5 14a6.5 6.5 0 0 1 3 6"/></svg>Users</a>{% endif %}
  </nav>
  <div class="who">
    <span><b>{{ s.user }}</b><span class="role">{{ s.role }}</span></span>
    <button hx-post="{{ s.base }}logout">Log out</button>
  </div>
</aside>
<main>
{% block main %}{% endblock %}
</main>
</div>
{% else %}
<div class="login-wrap">
{% block anon %}{% endblock %}
</div>
{% endif %}
</body>
</html>
