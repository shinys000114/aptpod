{% if jobs.is_empty() %}<p class="empty">No jobs yet.</p>{% else %}
<div class="table-wrap"><table>
  <thead><tr><th class="num">#</th><th>Started</th><th>State</th><th>Kind</th><th>Resource</th><th>User</th><th>Result</th></tr></thead>
  <tbody>
  {% for j in jobs %}
  <tr>
    <td class="num"><a href="{{ s.base }}jobs/{{ j.id }}">{{ j.id }}</a></td>
    <td class="nowrap">{{ j.created }}</td>
    <td><span class="badge {{ j.state_class }}">{{ j.state }}</span></td>
    <td class="nowrap">{{ j.kind }}</td><td class="mono">{{ j.resource }}</td><td>{{ j.user }}</td>
    <td class="wrap">{{ j.text }}</td>
  </tr>
  {% endfor %}
  </tbody>
</table></div>
{% endif %}
