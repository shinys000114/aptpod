{% extends "base.html" %}
{% block title %}Users · aptpod{% endblock %}
{% block main %}
<div class="page-head"><div class="title"><h1>Users</h1><p class="sub">reader: read only · publisher: packages, snapshots, rollback · admin: everything</p></div></div>
<div class="card">
  <div class="card-head"><h2>Add a user</h2></div>
  <div class="card-body">
  <form hx-post="{{ s.base }}admin/users" hx-target="#users">
    <div class="fields">
      <label class="field"><span>Name</span><input name="name" required></label>
      <label class="field"><span>Role</span><select name="role"><option>reader</option><option selected>publisher</option><option>admin</option></select></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
    </div>
    <div class="form-foot"><span class="spacer"></span><button type="submit">Add user</button></div>
  </form>
  </div>
</div>
<div class="card"><div class="card-head"><h2>Users</h2></div><div id="users">{% include "users_table.html" %}</div></div>
{% endblock %}
