# SPDX-License-Identifier: GPL-3.0-only
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Real tools and real apt: dpkg-deb fixtures, apt-ftparchive comparison,
  # gpg/gpgv signatures, and apt update/install in Debian and Ubuntu
  # containers. Missing tools fail instead of skipping.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils dpkg-dev gpg gpgv zstd
      - name: Tests with real apt
        env:
          APTPOD_REQUIRE_TOOLS: "1"
          APTPOD_E2E: "1"
        run: cargo test --workspace --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build
        with:
          version: 0.0.0-ci+${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/
          retention-days: 7
